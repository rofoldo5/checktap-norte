services:
  postgres:
    image: postgres:17-alpine
    container_name: checktap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${REPORT_TIMEZONE:-UTC}
      PGTZ: ${REPORT_TIMEZONE:-UTC}
    volumes:
      - checktap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - checktap_backend
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    image: ${CHECKTAP_IMAGE:-checktap-backend}:${CHECKTAP_IMAGE_TAG:-0.7.0}
    container_name: checktap-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: CheckTap
      APP_VERSION: ${CHECKTAP_IMAGE_TAG:-0.7.0}
      ENVIRONMENT: production
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-UTC}
      UVICORN_WORKERS: "1"
      DB_STARTUP_MAX_ATTEMPTS: "60"
      DB_STARTUP_DELAY_SECONDS: "2"
      WS_PING_INTERVAL: "20"
      WS_PING_TIMEOUT: "20"
      KEEP_ALIVE_TIMEOUT: "30"
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - checktap_backend
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  checktap_postgres_data:
    external: true
    name: checktap_postgres_data

networks:
  checktap_backend:
    name: checktap_backend
    driver: bridge
