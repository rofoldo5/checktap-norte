name: checktap
description: Aplicacion colaborativa offline-first de gestion de tareas.
publish_to: none
version: 0.12.0+15

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: 5.11.0
  shared_preferences: 2.5.5
  web_socket_channel: 3.0.3
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  synchronized: ^3.4.1+1
  workmanager: ^0.10.6
  share_plus: 10.1.4
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/checktap_logo.png
